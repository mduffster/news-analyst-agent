name: Daily Update

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 2pm UTC / 10am ET / 7am PT weekdays
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      # Preserve access to any environment-scoped provider credentials.
      name: github-pages
      deployment: false
    outputs:
      generation_outcome: ${{ steps.generate.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate daily updates
        id: generate
        continue-on-error: true
        run: python run.py update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Commit new reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topics/
          git diff --staged --quiet || git commit -m "Daily update $(date +%Y-%m-%d)"
          git push

      - name: Build static site
        run: python run.py build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  flag-incomplete-updates:
    # Report incomplete generation even if building or publishing fails.
    needs: [update, deploy]
    if: always() && needs.update.outputs.generation_outcome == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Flag incomplete updates
        run: |
          echo "::error::Report generation was incomplete. Check the Generate daily updates step for provider errors."
          exit 1
